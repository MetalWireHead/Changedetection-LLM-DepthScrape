# Test-environment-only override for the Claude Code sandbox, which has no direct internet: outbound traffic goes through
# an HTTPS proxy that re-signs TLS with its own CA. Not needed on a normal machine.
#   ./scripts/sandbox-proxy-forward.py &                       # containers -> the sandbox proxy
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#   ./scripts/sandbox-trust-ca.sh                              # Chrome trusts the sandbox CAs
services:
  changedetection:
    environment:
      - HTTPS_PROXY=http://host.docker.internal:40640
      - NO_PROXY=localhost,127.0.0.1,browser-selenium-chrome
      - REQUESTS_CA_BUNDLE=/ca-bundle.crt
      - SSL_CERT_FILE=/ca-bundle.crt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /root/.ccr/ca-bundle.crt:/ca-bundle.crt:ro
  browser-selenium-chrome:
    extra_hosts:
      - "host.docker.internal:host-gateway"
